# Render Blueprint – AI Meeting Notes Automation
# https://render.com/docs/blueprint-spec
#
# Deploy:  Render Dashboard → New → Blueprint Instance → connect this repo

databases:
  - name: meeting-notes-db
    plan: free
    databaseName: meeting_notes
    user: meeting_notes_user

services:
  # ── Backend (FastAPI) ──────────────────────────────────────
  - type: web
    name: ai-meeting-notes-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meeting-notes-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false          # you'll set this manually in the dashboard
      - key: PYTHONPATH
        value: .
      - key: PYTHON_VERSION
        value: "3.11.6"

  # ── Frontend (Vite + React) ────────────────────────────────
  - type: web
    name: ai-meeting-notes-ui
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-meeting-notes-api
          property: host
          # This gives you https://ai-meeting-notes-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
